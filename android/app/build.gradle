plugins {
    id 'com.android.application'
}

def code = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'tech.grandddlc.biology'
    compileSdk 34

    defaultConfig {
        applicationId 'tech.grandddlc.biology'
        minSdk 26
        targetSdk 34
        versionCode code
        versionName "1.0.${code}"
    }

    signingConfigs {
        release {
            // The keystore is created by CI (never committed); see .github/workflows/android.yml.
            storeFile file(System.getenv("KEYSTORE_FILE") ?: '../keystore/release.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: 'planner'
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
