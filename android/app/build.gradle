plugins {
    id 'com.android.application'
}

def code = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'tech.grandddlc.biology'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode code
        versionName "1.0.${code}"
    }

    // One codebase, six apps that install side by side.
    flavorDimensions 'subject'
    productFlavors {
        bio {
            dimension 'subject'
            applicationId 'tech.grandddlc.biology'
            resValue 'string', 'app_name', 'Biology'
        }
        chem {
            dimension 'subject'
            applicationId 'tech.grandddlc.chemistry'
            resValue 'string', 'app_name', 'Chemistry'
        }
        phys {
            dimension 'subject'
            applicationId 'tech.grandddlc.physics'
            resValue 'string', 'app_name', 'Physics'
        }
        math {
            dimension 'subject'
            applicationId 'tech.grandddlc.math'
            resValue 'string', 'app_name', 'Math'
        }
        logic {
            dimension 'subject'
            applicationId 'tech.grandddlc.logic'
            resValue 'string', 'app_name', 'Logic'
        }
        reading {
            dimension 'subject'
            applicationId 'tech.grandddlc.reading'
            resValue 'string', 'app_name', 'Reading'
        }
    }

    signingConfigs {
        release {
            // The keystore is created by CI (never committed); see .github/workflows/android.yml.
            storeFile file(System.getenv("KEYSTORE_FILE") ?: '../keystore/release.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: 'planner'
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
