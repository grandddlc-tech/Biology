name: Android APK

on:
  push:
    paths:
      - "src/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build offline web assets
        run: python3 scripts/build_android_assets.py

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BiologyPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BiologyPlanner-apk
          path: BiologyPlanner.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IMAT Biology Planner 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: BiologyPlanner.apk
          body: |
            Offline Android app for the IMAT biology study plan (8 Nov 2026 – 20 Mar 2027).
            Download BiologyPlanner.apk below and open it on your phone to install.
