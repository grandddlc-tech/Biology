name: Android APK

on:
  push:
    paths:
      - "src/**"
      - "android/**"
      - "scripts/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build offline web assets
        run: python3 scripts/build_android_assets.py

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64/KEYSTORE_PASSWORD secrets: signing with a one-off key. Updates will need an uninstall first."
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore android/keystore/release.jks -alias planner -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=IMAT Biology Planner"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp android/app/build/outputs/apk/bio/release/app-bio-release.apk BiologyPlanner.apk
          cp android/app/build/outputs/apk/chem/release/app-chem-release.apk ChemistryPlanner.apk
          cp android/app/build/outputs/apk/phys/release/app-phys-release.apk PhysicsPlanner.apk
          cp android/app/build/outputs/apk/math/release/app-math-release.apk MathPlanner.apk
          cp android/app/build/outputs/apk/logic/release/app-logic-release.apk LogicPlanner.apk
          cp android/app/build/outputs/apk/reading/release/app-reading-release.apk ReadingPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planner-apks
          path: |
            BiologyPlanner.apk
            ChemistryPlanner.apk
            PhysicsPlanner.apk
            MathPlanner.apk
            LogicPlanner.apk
            ReadingPlanner.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: IMAT Planners 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: |
            BiologyPlanner.apk
            ChemistryPlanner.apk
            PhysicsPlanner.apk
            MathPlanner.apk
            LogicPlanner.apk
            ReadingPlanner.apk
          body: |
            Offline Android apps for the IMAT study plans (8 Nov 2026 – 20 Mar 2027).
            BiologyPlanner.apk: biology, one chapter a week.
            ChemistryPlanner.apk: chemistry, two chapters a week.
            PhysicsPlanner.apk: physics, two chapters a week.
            MathPlanner.apk: math, one chapter a week.
            LogicPlanner.apk: logic, one chapter every two weeks.
            ReadingPlanner.apk: reading, Sunday article, Tuesday test, Thursday vocabulary.
